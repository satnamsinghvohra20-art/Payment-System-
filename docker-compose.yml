version: '3.8'

services:
  splitpay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitpay_enterprise_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PAYMENT_GATEWAY_DEFAULT=sandbox
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/info"]
      interval: 30s
      timeout: 10s
      retries: 3
